name: Refresh rail network

on:
  schedule:
    - cron: '43 6 * * 0'
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'tools/fetch_rail_network.py'

concurrency:
  group: refresh-rail-network
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Generate Metrô and CPTM stations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Generate static rail network from OpenStreetMap
        run: python3 tools/fetch_rail_network.py
      - name: Commit only when data changed
        shell: bash
        run: |
          if git diff --quiet -- assets/rail/rail_network.json; then
            echo 'Rail network unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/rail/rail_network.json
          git commit -m 'chore(data): refresh rail network'
          git push origin HEAD:develop

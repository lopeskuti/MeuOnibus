name: Publish release

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Versão publicada (exemplo: 1.0.9)"
        required: true
        default: "1.0.9"
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Generate data and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true
      - run: ./tools/bootstrap.sh
      - name: Generate current transit data
        run: |
          bash tools/fetch_gtfs.sh
          python3 tools/fetch_rail_network.py
      - name: Verify generated GTFS and rail assets
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {
              'assets/gtfs/stops.json': list,
              'assets/gtfs/stop_routes.json': dict,
              'assets/gtfs/routes.json': dict,
              'assets/gtfs/shapes.json': dict,
          }
          for filename, expected_type in expected.items():
              path = Path(filename)
              with path.open(encoding='utf-8') as asset:
                  data = json.load(asset)
              if not isinstance(data, expected_type) or not data:
                  raise SystemExit(f'::error::Invalid generated asset: {path}')
          rail = json.loads(Path('assets/rail/rail_network.json').read_text())
          if not rail.get('stations') or not rail.get('lines'):
              raise SystemExit('::error::Rail network has no stations or lines.')
          if any(not line.get('paths') for line in rail['lines']):
              raise SystemExit('::error::A rail line has no track geometry.')
          print(f"GTFS stops={len(json.loads(Path('assets/gtfs/stops.json').read_text()))}; rail stations={len(rail['stations'])}; rail lines={len(rail['lines'])}")
          PY
      - run: flutter test
      - run: flutter analyze

  android:
    name: Signed Android APK and AAB
    runs-on: ubuntu-latest
    needs: quality
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true
      - name: Bootstrap platforms
        run: ./tools/bootstrap.sh
      - name: Run tests
        run: flutter test
      - name: Generate current transit data
        run: |
          bash tools/fetch_gtfs.sh
          python3 tools/fetch_rail_network.py
      - name: Check required secrets
        shell: bash
        env:
          SPTRANS_TOKEN: ${{ secrets.SPTRANS_TOKEN }}
        run: |
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD SPTRANS_TOKEN; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing GitHub secret: ${secret_name}"
              exit 1
            fi
          done
      - name: Install Android signing key
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
      - name: Prepare version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.build_name }}
        run: |
          build_name="$RELEASE_VERSION"
          [[ "$build_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::A versão deve seguir o formato X.Y.Z, por exemplo 1.0.9."; exit 1; }
          echo "BUILD_NAME=$build_name" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Build signed AAB
        run: >-
          flutter build appbundle --release
          --build-name "$BUILD_NAME"
          --build-number "$BUILD_NUMBER"
          --dart-define=SPTRANS_TOKEN="${{ secrets.SPTRANS_TOKEN }}"
      - name: Build signed APK
        run: >-
          flutter build apk --release
          --build-name "$BUILD_NAME"
          --build-number "$BUILD_NUMBER"
          --dart-define=SPTRANS_TOKEN="${{ secrets.SPTRANS_TOKEN }}"
      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meu-onibus-android-${{ env.BUILD_NAME }}-${{ env.BUILD_NUMBER }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error


  ios:
    name: Signed IPA and TestFlight upload
    runs-on: macos-26
    needs: quality
    env:
      APP_BUNDLE_ID: br.com.lopeskuti.meuonibus
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      SPTRANS_TOKEN: ${{ secrets.SPTRANS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true
      - name: Bootstrap platforms
        run: ./tools/bootstrap.sh
      - name: Run tests
        run: flutter test
      - name: Generate current transit data
        run: |
          bash tools/fetch_gtfs.sh
          python3 tools/fetch_rail_network.py
      - name: Verify prepared GTFS assets
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          directory = Path('assets/gtfs')
          expected = {
              'stops.json': list,
              'stop_routes.json': dict,
              'routes.json': dict,
              'shapes.json': dict,
          }

          counts = {}
          for name, expected_type in expected.items():
              path = directory / name
              if not path.is_file() or path.stat().st_size <= 2:
                  raise SystemExit(f'::error::GTFS asset is missing or empty: {path}')
              with path.open(encoding='utf-8') as asset:
                  data = json.load(asset)
              if not isinstance(data, expected_type) or not data:
                  raise SystemExit(f'::error::GTFS asset has no usable data: {path}')
              counts[name] = len(data)

          print(
              'GTFS assets ready: '
              + ', '.join(f'{name}={count}' for name, count in counts.items())
          )
          PY
          du -h assets/gtfs/*.json
      - name: Check required secrets
        shell: bash
        run: |
          required_secrets=(APPLE_TEAM_ID IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_PROVISIONING_PROFILE_BASE64 IOS_PROVISIONING_PROFILE_NAME APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64 SPTRANS_TOKEN)
          for secret_name in "${required_secrets[@]}"; do
            if [ -z "${!secret_name:-}" ]; then echo "::error::Missing GitHub secret: ${secret_name}"; exit 1; fi
          done
      - name: Prepare version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.build_name }}
        run: |
          build_name="$RELEASE_VERSION"
          [[ "$build_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::A versão deve seguir o formato X.Y.Z, por exemplo 1.0.9."; exit 1; }
          echo "BUILD_NAME=$build_name" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Install signing certificate
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate_path="$RUNNER_TEMP/apple_distribution.p12"
          cert_password="$(printf '%s' "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:-}" | tr -d '\r\n')"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 -D > "$certificate_path"
          openssl pkcs12 -in "$certificate_path" -passin pass:"$cert_password" -nokeys -clcerts -noout >/dev/null 2>&1 || { echo "::error::Invalid iOS distribution certificate or password."; exit 1; }
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$cert_password" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
      - name: Install provisioning profile
        shell: bash
        run: |
          profile_path="$RUNNER_TEMP/app_store.mobileprovision"
          profile_plist="$RUNNER_TEMP/app_store_profile.plist"
          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | tr -d '\r\n ' | base64 -D > "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print Name' "$profile_plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$profile_plist")"
          [ "$profile_team" = "$APPLE_TEAM_ID" ] || { echo "::error::Provisioning profile Team ID mismatch."; exit 1; }
          [ "$profile_app_id" = "$APPLE_TEAM_ID.$APP_BUNDLE_ID" ] || { echo "::error::Provisioning profile Bundle ID mismatch."; exit 1; }
          [ "$IOS_PROVISIONING_PROFILE_NAME" = "$profile_name" ] || { echo "::error::Provisioning profile name mismatch."; exit 1; }
          cp "$profile_path" "$profiles_dir/$profile_uuid.mobileprovision"
          echo "RESOLVED_PROVISIONING_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
      - name: Configure Runner signing
        shell: bash
        run: |
          cat >> ios/Flutter/Release.xcconfig <<EOF
          DEVELOPMENT_TEAM=$APPLE_TEAM_ID
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER=$RESOLVED_PROVISIONING_PROFILE_NAME
          EOF
      - name: Generate export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>destination</key><string>export</string>
          <key>method</key><string>app-store-connect</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          <key>provisioningProfiles</key><dict><key>${APP_BUNDLE_ID}</key><string>${RESOLVED_PROVISIONING_PROFILE_NAME}</string></dict>
          <key>manageAppVersionAndBuildNumber</key><false/>
          <key>stripSwiftSymbols</key><true/>
          <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          echo "EXPORT_OPTIONS_PLIST=$RUNNER_TEMP/ExportOptions.plist" >> "$GITHUB_ENV"
      - name: Build Flutter iOS assets
        run: flutter build ios --release --no-codesign --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER" --dart-define=SPTRANS_TOKEN="$SPTRANS_TOKEN"
      - name: Archive signed app
        shell: bash
        run: |
          xcodebuild archive -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -destination "generic/platform=iOS" -archivePath build/ios/archive/Runner.xcarchive CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION="$BUILD_NAME"
      - name: Export IPA
        shell: bash
        run: |
          xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive -exportOptionsPlist "$EXPORT_OPTIONS_PLIST" -exportPath build/ios/ipa
          ipa_path="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          [ -n "$ipa_path" ] || { echo "::error::IPA was not generated."; exit 1; }
          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"
      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: meu-onibus-ios-${{ env.BUILD_NAME }}-${{ env.BUILD_NUMBER }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
      - name: Upload to App Store Connect / TestFlight
        shell: bash
        run: |
          api_key_id="$(printf '%s' "$APP_STORE_CONNECT_KEY_ID" | tr -d '\r\n[:space:]')"
          api_issuer_id="$(printf '%s' "$APP_STORE_CONNECT_ISSUER_ID" | tr -d '\r\n[:space:]')"
          private_keys_dir="$HOME/.appstoreconnect/private_keys"
          api_key_path="$private_keys_dir/AuthKey_${api_key_id}.p8"
          mkdir -p "$private_keys_dir"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | tr -d '\r\n ' | base64 -D > "$api_key_path"
          chmod 600 "$api_key_path"
          openssl pkey -in "$api_key_path" -noout >/dev/null 2>&1 || { echo "::error::Invalid App Store Connect .p8 API key."; exit 1; }
          xcrun altool --upload-app --type ios -f "$IPA_PATH" --apiKey "$api_key_id" --apiIssuer "$api_issuer_id"
      - name: Clean up signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi

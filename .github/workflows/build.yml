name: Build

on:
  push:
    branches: [develop, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  quality:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true
      - run: ./tools/bootstrap.sh
      - run: flutter analyze

  android:
    name: Android AAB + APK
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true
      - run: ./tools/bootstrap.sh
      - name: Validate SPTrans token
        shell: bash
        env:
          SPTRANS_TOKEN: ${{ secrets.SPTRANS_TOKEN }}
        run: |
          if [ -z "${SPTRANS_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret SPTRANS_TOKEN. Configure it under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Prepare current SPTrans GTFS
        run: bash tools/fetch_gtfs.sh
      - name: Build Android AAB
        run: flutter build appbundle --release --dart-define=SPTRANS_TOKEN="${{ secrets.SPTRANS_TOKEN }}"
      - name: Build Android APK
        run: flutter build apk --release --dart-define=SPTRANS_TOKEN="${{ secrets.SPTRANS_TOKEN }}"
      - uses: actions/upload-artifact@v4
        with:
          name: meu-onibus-android-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: meu-onibus-android-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned build
    runs-on: macos-26
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true
      - run: ./tools/bootstrap.sh
      - name: Validate SPTrans token
        shell: bash
        env:
          SPTRANS_TOKEN: ${{ secrets.SPTRANS_TOKEN }}
        run: |
          if [ -z "${SPTRANS_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret SPTRANS_TOKEN. Configure it under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Prepare current SPTrans GTFS
        run: bash tools/fetch_gtfs.sh
      - run: flutter build ios --release --no-codesign --dart-define=SPTRANS_TOKEN="${{ secrets.SPTRANS_TOKEN }}"
      - uses: actions/upload-artifact@v4
        with:
          name: meu-onibus-ios-unsigned-${{ github.sha }}
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error

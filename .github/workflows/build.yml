name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  quality:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true
      - run: ./tools/bootstrap.sh
      - run: flutter test
      - run: flutter analyze

  ios:
    name: iOS app build (unsigned)
    runs-on: macos-26
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true
      - run: ./tools/bootstrap.sh
      - name: Validate SPTrans token against Olho Vivo
        shell: bash
        env:
          SPTRANS_TOKEN: ${{ secrets.SPTRANS_TOKEN }}
        run: |
          if [ -z "${SPTRANS_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret SPTRANS_TOKEN. Configure it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST \
            -H "Content-Length: 0" \
            "https://api.olhovivo.sptrans.com.br/v2.1/Login/Autenticar?token=${SPTRANS_TOKEN}")"
          echo "Olho Vivo authentication response: ${response}"
          if [ "${response}" != "true" ]; then
            echo "::error::SPTrans Olho Vivo rejected SPTRANS_TOKEN (expected response: true)."
            exit 1
          fi
      - name: Prepare current SPTrans GTFS
        run: bash tools/fetch_gtfs.sh
      - run: flutter build ios --release --no-codesign --dart-define=SPTRANS_TOKEN="${{ secrets.SPTRANS_TOKEN }}"

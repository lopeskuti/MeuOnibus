name: Refresh GTFS

on:
  schedule:
    - cron: '17 6 * * 0'
  workflow_dispatch:

concurrency:
  group: refresh-gtfs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Download and version GTFS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Download current SPTrans GTFS
        run: bash tools/fetch_gtfs.sh
      - name: Commit only when data changed
        shell: bash
        run: |
          if git diff --quiet -- assets/gtfs; then
            echo 'GTFS unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/gtfs
          git commit -m 'chore(data): refresh SPTrans GTFS'
          git push origin HEAD:develop

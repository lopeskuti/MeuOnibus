name: meu_onibus
description: Mapa de ônibus de São Paulo usando SPTrans Olho Vivo + GTFS.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  geolocator: ^14.0.3
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/gtfs/stops.json
    - assets/gtfs/stop_routes.json
    - assets/gtfs/routes.json
    - assets/gtfs/shapes.json
    - assets/gtfs/terminals.json
    - assets/gtfs/schedules.json

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  remove_alpha_ios: true
